name: Determinism Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install networkx
      - name: Run determinism demo
        run: python examples/determinism-demo/run_demo.py
